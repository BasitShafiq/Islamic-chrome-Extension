<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-Minute Deen</title>
  
  <!-- Import Arabic fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main styles -->
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <!-- App container -->
  <div id="app">
    <!-- Loading state shown initially -->
    <div class="reminder-card">
      <div class="reminder-content">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p class="loading-text">Loading your reminder...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main application script -->
  <script type="module" src="index.js"></script>
</body>
</html>
